name: Publish to PowerShell Gallery
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershell-gallery-publication
  cancel-in-progress: false

jobs:
  release-gates:
    name: Run the full supported release matrix
    uses: ./.github/workflows/Build Module.yml

  publish:
    needs: release-gates
    runs-on: windows-latest
    environment:
      name: powershell-gallery
    permissions:
      contents: read
    steps:
    - name: Clone Project Files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Bootstrap build dependencies
      shell: pwsh
      run: ./actions_bootstrap.ps1
    - name: Download the exact tested PowerShell 7.6 artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
      with:
        name: module-artifact-pwsh-7.6.6
        path: ./src/Artifacts
    - name: Download the exact tested archive and manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
      with:
        name: zip-archive-pwsh-7.6.6
        path: ./src/Archive
    - name: Verify and publish the exact artifact
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
          throw 'Configure the PSGALLERY_PUBLISH_API_KEY secret in the powershell-gallery environment before publishing.'
        }
        $PSVersionTable | Format-List
        ./.github/workflows/publish.ps1 -PSGalleryApiKey $env:PSGALLERY_API_KEY -ArtifactPath ./src/Artifacts -ArchiveDirectory ./src/Archive
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_PUBLISH_API_KEY }}

  verify-published:
    name: Verify published install - PowerShell ${{ matrix.version }}
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '5.1'
            shell: powershell
          - version: '7.4.20'
            shell: pwsh
          - version: '7.5.11'
            shell: pwsh
          - version: '7.6.6'
            shell: pwsh
    steps:
      - name: Checkout the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install exact PowerShell runtime
        if: matrix.version != '5.1'
        shell: pwsh
        run: ./.github/scripts/Install-ExactPowerShell.ps1 -Version '${{ matrix.version }}'
      - name: Download the tested archive and content manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: zip-archive-pwsh-7.6.6
          path: ./src/Archive
      - name: Install the exact published Gallery version and verify its payload
        shell: ${{ matrix.shell }}
        env:
          EXPECTED_RUNTIME: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (($env:EXPECTED_RUNTIME -eq '5.1' -and -not $PSVersionTable.PSVersion.ToString().StartsWith('5.1.')) -or
              ($env:EXPECTED_RUNTIME -ne '5.1' -and $PSVersionTable.PSVersion -ne [version]$env:EXPECTED_RUNTIME)) {
              throw "Unexpected verification runtime: $($PSVersionTable.PSVersion)."
          }
          Import-Module PowerShellGet -MinimumVersion 2.2.5 -Force -ErrorAction Stop
          Get-PackageProvider -Name NuGet -ForceBootstrap | Out-Null
          if (@(Get-Module -ListAvailable -Name TheCleaners).Count -gt 0) {
              throw 'Published-install verification requires a clean runner without TheCleaners.'
          }
          $Version = $env:GITHUB_REF_NAME.Substring(1)
          $Found = $false
          for ($Attempt = 1; $Attempt -le 24; $Attempt++) {
              try {
                  $null = Find-Module -Name TheCleaners -RequiredVersion $Version -AllowPrerelease -Repository PSGallery -ErrorAction Stop
                  $Found = $true
                  break
              } catch {
                  if ($Attempt -eq 24) { throw }
                  Start-Sleep -Seconds 15
              }
          }
          if (-not $Found) { throw 'The published Gallery version was not discoverable.' }
          Install-Module -Name TheCleaners -RequiredVersion $Version -AllowPrerelease -Repository PSGallery -Scope CurrentUser -Force -ErrorAction Stop
          $Installed = Get-InstalledModule -Name TheCleaners -RequiredVersion $Version -AllowPrerelease -ErrorAction Stop
          $SearchRoot = Split-Path -Path (Split-Path -Path $Installed.InstalledLocation -Parent) -Parent
          $Manifests = @(Get-ChildItem -LiteralPath ./src/Archive -Filter '*.manifest.json' -File)
          if ($Manifests.Count -ne 1) { throw 'Expected one tested archive content manifest.' }
          $null = New-Item -Path ./src/Reports -ItemType Directory -Force
          $Probe = @{
              ModulePath = $Installed.InstalledLocation
              ModuleSearchRoot = $SearchRoot
              ArchiveManifestPath = $Manifests[0].FullName
              ExpectedCommit = $env:GITHUB_SHA
              ExpectedTag = $env:GITHUB_REF_NAME
              RepositoryName = 'PSGallery'
              OutputPath = './src/Reports/PublishedInstall.json'
          }
          ./.github/scripts/Test-RepositoryModule.ps1 @Probe
      - name: Retain published-install verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: published-install-${{ matrix.version }}
          path: ./src/Reports/PublishedInstall.json
          if-no-files-found: error
