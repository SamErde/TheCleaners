name: Publish to PowerShell Gallery
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    name: Run the full supported release matrix
    uses: ./.github/workflows/Build Module.yml

  publish:
    needs: release-gates
    runs-on: windows-latest
    environment:
      name: powershell-gallery
    permissions:
      contents: read
    steps:
    - name: Clone Project Files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Bootstrap build dependencies
      shell: pwsh
      run: ./actions_bootstrap.ps1
    - name: Download the exact tested PowerShell 7.6 artifact
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
      with:
        name: module-artifact-pwsh-7.6.6
        path: ./src/Artifacts
    - name: Download the exact tested archive and manifest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
      with:
        name: zip-archive-pwsh-7.6.6
        path: ./src/Archive
    - name: Verify and publish the exact artifact
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
          throw 'Configure the PSGALLERY_PUBLISH_API_KEY secret in the powershell-gallery environment before publishing.'
        }
        $PSVersionTable | Format-List
        ./.github/workflows/publish.ps1 -PSGalleryApiKey $env:PSGALLERY_API_KEY -ArtifactPath ./src/Artifacts -ArchiveDirectory ./src/Archive
      env:
        PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_PUBLISH_API_KEY }}
