name: Build TheCleaners Module
on:
  pull_request:
    branches: [main, prerelease]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  NO_COLOR: '1'
  TC_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  TC_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  powershell-7:
    name: PowerShell ${{ matrix.channel }} - test and build
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: 7.6 LTS
            version: 7.6.6
          - channel: 7.5 stable
            version: 7.5.11
          - channel: 7.4 LTS
            version: 7.4.20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.TC_BUILD_COMMIT }}
      - name: Install exact PowerShell runtime
        shell: pwsh
        run: ./.github/scripts/Install-ExactPowerShell.ps1 -Version '${{ matrix.version }}'
      - name: Bootstrap
        shell: pwsh
        run: ./actions_bootstrap.ps1
      - name: Test and build
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSVersion -ne [version]'${{ matrix.version }}') {
              throw "The job is running PowerShell $($PSVersionTable.PSVersion), not the requested ${{ matrix.version }}."
          }
          Invoke-Build -File .\src\TheCleaners.build.ps1
      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results-pwsh-${{ matrix.version }}
          path: ./src/Reports
          if-no-files-found: error
      - name: Upload module artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: module-artifact-pwsh-${{ matrix.version }}
          path: ./src/Artifacts
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zip-archive-pwsh-${{ matrix.version }}
          path: ./src/Archive/*
          if-no-files-found: error

  windows-powershell:
    name: Windows PowerShell 5.1 - compatibility, API, and fixture safety
    runs-on: windows-latest
    needs: powershell-7
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.TC_BUILD_COMMIT }}
      - name: Bootstrap exact dependencies
        shell: powershell
        run: ./actions_bootstrap.ps1
      - name: Download PowerShell 7.6 LTS artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: module-artifact-pwsh-7.6.6
          path: ./src/Artifacts
      - name: Download PowerShell 7.6 LTS archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          name: zip-archive-pwsh-7.6.6
          path: ./src/Archive
      - name: Parse and test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw 'This job must run with Windows PowerShell 5.1.'
          }
          $ParseFailures = @(Get-ChildItem -LiteralPath ./src/TheCleaners -Recurse -File | Where-Object Extension -In '.ps1', '.psm1', '.psd1' | ForEach-Object {
              $Tokens = $null
              $ParseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors)
              $ParseErrors
          })
          if ($ParseFailures.Count -gt 0) {
              throw ($ParseFailures | Out-String)
          }
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
          . .\src\TheCleaners\Private\Initialize-TheCleanersNativeFileInterop.ps1
          Initialize-TheCleanersNativeFileInterop
          $ResultsDirectory = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'TestResults'
          $null = New-Item -Path $ResultsDirectory -ItemType Directory -Force
          $Configuration = New-PesterConfiguration
          # Load the CodeDOM-generated native helper in the parent Windows
          # PowerShell process before Pester creates worker runspaces.
          $UnitTests = @(Get-ChildItem -LiteralPath (Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'src/Tests/Unit') -Filter '*.Tests.ps1' -File | ForEach-Object { $_.FullName })
          $Configuration.Run.Path = $UnitTests + @(Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'src/Tests/Integration')
          $Configuration.Run.PassThru = $true
          $Configuration.TestResult.Enabled = $true
          $Configuration.TestResult.OutputPath = Join-Path -Path $ResultsDirectory -ChildPath 'WindowsPowerShell51.xml'
          $Configuration.TestResult.OutputFormat = 'NUnitXml'
          $Configuration.Output.Verbosity = 'Detailed'
          $Result = Invoke-Pester -Configuration $Configuration
          $Summary = [ordered]@{
              Commit = (& git rev-parse HEAD).Trim()
              Runtime = $PSVersionTable.PSVersion.ToString()
              PSEdition = $PSVersionTable.PSEdition
              OS = [Environment]::OSVersion.VersionString
              TotalCount = $Result.TotalCount
              PassedCount = $Result.PassedCount
              FailedCount = $Result.FailedCount
              SkippedCount = $Result.SkippedCount
              NotRunCount = $Result.NotRunCount
              CoveragePercent = $null
              ArtifactProducer = '7.6.6'
              ArchiveSHA256 = (Get-FileHash ./src/Archive/TheCleaners_*.zip | Where-Object Path -NotLike '*.repeat.zip').Hash
          }
          $Summary | ConvertTo-Json | Set-Content (Join-Path $ResultsDirectory 'WindowsPowerShell51.json') -Encoding UTF8
          $Skipped = if ($null -eq $Result.SkippedCount) { 0 } else { [int]$Result.SkippedCount }
          $NotRun = if ($null -eq $Result.NotRunCount) { 0 } else { [int]$Result.NotRunCount }
          if ($Result.TotalCount -eq 0 -or $Result.Result -ne 'Passed' -or $Result.FailedCount -ne 0 -or $Skipped -ne 0 -or $NotRun -ne 0) {
              throw "Windows PowerShell 5.1 test gate failed. Total=$($Result.TotalCount); Failed=$($Result.FailedCount); Skipped=$Skipped; NotRun=$NotRun."
          }
      - name: Run native ACL fixture directly under Windows PowerShell 5.1
        shell: powershell
        run: |
          $ConfirmPreference = 'None'
          $FixtureParent = Join-Path -Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)) -ChildPath 'Temp'
          $Evidence = & .\lab\Invoke-TheCleanersAclFixture.ps1 -FixtureParent $FixtureParent | ConvertFrom-Json
          $Evidence | ConvertTo-Json -Depth 8
          if (-not $Evidence.Acceptance) {
              throw 'The Windows PowerShell 5.1 native ACL fixture did not pass acceptance checks.'
          }
      - name: Upload Windows PowerShell results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results-windows-powershell-51
          path: ./TestResults
          if-no-files-found: error

  archive-reproducibility:
    name: Compare exact archives across supported PS7 runtimes
    runs-on: windows-latest
    needs: powershell-7
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.TC_BUILD_COMMIT }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: zip-archive-pwsh-*
          path: ./downloaded-archives
      - name: Verify content, metadata, sidecars, repeated bytes, and cross-runtime bytes
        shell: pwsh
        run: python .github/scripts/Compare-Archives.py ./downloaded-archives --commit $env:TC_BUILD_COMMIT --versions 7.4.20 7.5.11 7.6.6 --output ArchiveComparison.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: archive-comparison
          path: ArchiveComparison.json
          if-no-files-found: error

  documentation:
    name: Strict documentation build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.TC_BUILD_COMMIT }}
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: '3.x'
      - run: python -m pip install -r docs/requirements.txt
      - run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - run: python -m mkdocs build --strict --site-dir site
      - name: Check whitespace in the tested change range
        shell: bash
        run: |
          if [[ -n "$TC_DIFF_BASE" && "$TC_DIFF_BASE" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$TC_DIFF_BASE" "$TC_BUILD_COMMIT"
          else
            git show --format= --check "$TC_BUILD_COMMIT"
          fi
          git diff --check
