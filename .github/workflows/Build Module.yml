name: Build TheCleaners Module
on:
  pull_request:
    branches: [main, prerelease]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PowerShell 7 - test and build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Bootstrap
        shell: pwsh
        run: ./actions_bootstrap.ps1
      - name: Test and build
        shell: pwsh
        run: |
          $PSVersionTable | Format-List
          Invoke-Build -File .\src\TheCleaners.build.ps1
      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results-pwsh
          path: ./src/Artifacts/testOutput
          if-no-files-found: error
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zip-archive
          path: ./src/Archive
          if-no-files-found: error

  windows-powershell:
    name: Windows PowerShell 5.1 - safety and API tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install test dependency
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module -Name Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop
      - name: Parse and test with Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable | Format-List
          if ($PSVersionTable.PSVersion.Major -ne 5 -or $PSVersionTable.PSVersion.Minor -ne 1) {
              throw 'This job must run with Windows PowerShell 5.1.'
          }
          $ParseFailures = @(Get-ChildItem -LiteralPath ./src/TheCleaners -Recurse -File | Where-Object Extension -In '.ps1', '.psm1', '.psd1' | ForEach-Object {
              $Tokens = $null
              $ParseErrors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$Tokens, [ref]$ParseErrors)
              $ParseErrors
          })
          if ($ParseFailures.Count -gt 0) {
              throw ($ParseFailures | Out-String)
          }
          Import-Module -Name Pester -RequiredVersion 5.7.1 -Force -ErrorAction Stop
          $ResultsDirectory = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'TestResults'
          $null = New-Item -Path $ResultsDirectory -ItemType Directory -Force
          $Configuration = New-PesterConfiguration
          $Configuration.Run.Path = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath 'src/Tests/Unit'
          $Configuration.Run.PassThru = $true
          $Configuration.TestResult.Enabled = $true
          $Configuration.TestResult.OutputPath = Join-Path -Path $ResultsDirectory -ChildPath 'WindowsPowerShell51.xml'
          $Configuration.TestResult.OutputFormat = 'NUnitXml'
          $Configuration.Output.Verbosity = 'Detailed'
          $Result = Invoke-Pester -Configuration $Configuration
          if ($Result.TotalCount -eq 0 -or $Result.Result -ne 'Passed') {
              throw 'Windows PowerShell 5.1 unit-test gate failed.'
          }
      - name: Upload Windows PowerShell results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pester-results-windows-powershell-51
          path: ./TestResults
          if-no-files-found: error
