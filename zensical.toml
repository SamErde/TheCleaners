[project]
site_name = "The Cleaners PowerShell Module"
site_url = "https://day3bits.com/TheCleaners/"
repo_url = "https://github.com/SamErde/TheCleaners"
repo_name = "SamErde/TheCleaners"
site_description = "Windows maintenance commands with explicit cleanup safety controls. IIS and Exchange log discovery commands are preview-only."
site_author = "Sam Erde"
copyright = "(c) 2026 Sam Erde"
docs_dir = "docs"
site_dir = "site"
strict = true
nav = [
  { "Home" = "index.md" },
  { "Safety" = "safety-and-confirmation.md" },
  { "Contracts" = "command-contracts.md" },
  { "Support" = "support-matrix.md" },
  { "Migration to 1.0" = "migration-to-1.0.md" },
  { "0.0.15-beta release" = "releases/0.0.15-beta.md" },
  { "Functions" = [
    { "Module reference" = "TheCleaners.md" },
    { "Get-TheCleaners" = "Get-TheCleaners.md" },
    { "Clear-CurrentUserTemp" = "Clear-CurrentUserTemp.md" },
    { "Clear-WindowsTemp" = "Clear-WindowsTemp.md" },
    { "Clear-OldIISLog" = "Clear-OldIISLog.md" },
    { "Clear-OldExchangeLog (preview)" = "Clear-OldExchangeLog.md" },
    { "Get-StaleUserProfile" = "Get-StaleUserProfile.md" },
    { "Start-Cleaning (alias)" = "Start-Cleaning.md" },
  ] },
  { "Development" = [
    { "Packaging and reproducibility" = "packaging.md" },
    { "Publishing controls" = "publishing.md" },
    { "1.0 implementation plan" = "release-plan-1.0.md" },
    { "Next-stage prompts" = "next-stage-prompts.md" },
    { "Windows lab acceptance" = "lab-acceptance.md" },
    { "Documentation deployment gate" = "deployment-validation.md" },
  ] },
]

[project.theme]
variant = "classic"
language = "en"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.path",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.tracking",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
  "toc.integrate",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
